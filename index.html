<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>FlyFly · Sobrevuela tu ciudad</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;600;800&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="world"></div>

  <header id="topbar">
    <div class="brand">✈ FlyFly</div>
    <nav id="cities"></nav>
    <form id="search"><input id="search-input" placeholder="Vuela a cualquier lugar…" autocomplete="off" /></form>
  </header>

  <section id="hud">
    <div><span id="hud-speed">0</span><small>kt</small></div>
    <div><span id="hud-alt">0</span><small>m</small></div>
    <div><span id="hud-heading">000</span><small>°</small></div>
    <div class="throttle"><i id="hud-throttle"></i></div>
  </section>

  <section id="nearest" hidden>
    <span id="nearest-arrow">➤</span>
    <div><b id="nearest-name"></b><small id="nearest-dist"></small></div>
  </section>

  <aside id="card" hidden>
    <button id="card-close" aria-label="Cerrar">×</button>
    <div id="card-sponsor" hidden></div>
    <img id="card-img" alt="" />
    <h2 id="card-title"></h2>
    <p id="card-text"></p>
    <a id="card-link" target="_blank" rel="noopener">Leer más en Wikipedia →</a>
  </aside>

  <div id="counter">🎈 <span id="visited">0</span> / <span id="total">0</span></div>
  <div id="toast" hidden></div>

  <div id="touch">
    <div id="stick"><i></i></div>
    <div class="touch-buttons">
      <button data-throttle="1">＋</button>
      <button data-throttle="-1">－</button>
      <button id="cam-btn">🎥</button>
    </div>
  </div>

  <div id="intro">
    <div class="intro-box">
      <h1>✈ FlyFly</h1>
      <p>Sobrevuela ciudades reales en 3D y acércate a los globos para descubrir sus lugares de interés.</p>
      <div class="keys">
        <span><kbd>↑</kbd><kbd>↓</kbd> subir / bajar</span>
        <span><kbd>←</kbd><kbd>→</kbd> girar</span>
        <span><kbd>W</kbd><kbd>S</kbd> acelerar / frenar</span>
        <span><kbd>A</kbd><kbd>D</kbd> timón</span>
        <span><kbd>C</kbd> cámara · <kbd>M</kbd> sonido · <kbd>Esc</kbd> cerrar ficha</span>
      </div>
      <button id="start" disabled>Cargando mundo…</button>
      <p id="mode-note" class="note"></p>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
